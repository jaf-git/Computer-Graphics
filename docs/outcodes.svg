<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="620" height="300" rx="8" fill="#F7F9FA"/>

  <!-- nine regions -->
  <g>
    <rect x="60"  y="40"  width="120" height="70" fill="#42708F" fill-opacity=".07"/>
    <rect x="180" y="40"  width="200" height="70" fill="#42708F" fill-opacity=".07"/>
    <rect x="380" y="40"  width="120" height="70" fill="#42708F" fill-opacity=".07"/>
    <rect x="60"  y="110" width="120" height="90" fill="#42708F" fill-opacity=".07"/>
    <rect x="180" y="110" width="200" height="90" fill="#B86A10" fill-opacity=".13"/>
    <rect x="380" y="110" width="120" height="90" fill="#42708F" fill-opacity=".07"/>
    <rect x="60"  y="200" width="120" height="70" fill="#42708F" fill-opacity=".07"/>
    <rect x="180" y="200" width="200" height="70" fill="#42708F" fill-opacity=".07"/>
    <rect x="380" y="200" width="120" height="70" fill="#42708F" fill-opacity=".07"/>
  </g>

  <g stroke="#9FB0BC" stroke-width="1.2" stroke-dasharray="5 4">
    <path d="M60 110h440M60 200h440M180 40v230M380 40v230"/>
  </g>

  <rect x="180" y="110" width="200" height="90" fill="none" stroke="#B86A10" stroke-width="2.6"/>
  <text x="280" y="152" fill="#B86A10" font-size="15" font-weight="700" text-anchor="middle">0000</text>
  <text x="280" y="172" fill="#8C6A38" font-size="12" text-anchor="middle">viewport — visible</text>

  <g font-size="15" font-weight="600" fill="#2F5670" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace">
    <text x="120" y="80">1001</text>
    <text x="280" y="80">1000</text>
    <text x="440" y="80">1010</text>
    <text x="120" y="160">0001</text>
    <text x="440" y="160">0010</text>
    <text x="120" y="240">0101</text>
    <text x="280" y="240">0100</text>
    <text x="440" y="240">0110</text>
  </g>

  <g font-size="12.5">
    <text x="524" y="60"  fill="#1B3A52" font-weight="700">Bit meaning</text>
    <text x="524" y="84"  fill="#5B6873">1 · · ·  above top</text>
    <text x="524" y="104" fill="#5B6873">· 1 · ·  below bottom</text>
    <text x="524" y="124" fill="#5B6873">· · 1 ·  right of x-max</text>
    <text x="524" y="144" fill="#5B6873">· · · 1  left of x-min</text>
    <text x="524" y="186" fill="#1B3A52" font-weight="700">Decide with bits</text>
    <text x="524" y="210" fill="#5B6873">A | B = 0 → accept</text>
    <text x="524" y="230" fill="#5B6873">A &amp; B ≠ 0 → reject</text>
    <text x="524" y="250" fill="#5B6873">otherwise → clip</text>
  </g>
</svg>
