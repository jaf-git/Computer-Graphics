<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" width="620" height="260" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="620" height="260" rx="8" fill="#F7F9FA"/>
  <g stroke="#DCE2E8" stroke-width="1">
    <path d="M20 40h580M20 80h580M20 120h580M20 160h580M20 200h580"/>
    <path d="M60 20v220M100 20v220M140 20v220M180 20v220M220 20v220M260 20v220M300 20v220M340 20v220M380 20v220M420 20v220M460 20v220M500 20v220M540 20v220"/>
  </g>
  <defs>
    <marker id="ah-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#B86A10"/></marker>
    <marker id="ah-b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#42708F"/></marker>
    <marker id="ah-s" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1B3A52"/></marker>
  </defs>

  <path d="M60 200 L580 200" stroke="#8C99A4" stroke-width="1.4"/>
  <path d="M60 200 L60 30"  stroke="#8C99A4" stroke-width="1.4"/>

  <!-- parallelogram -->
  <path d="M60 200 L260 120 L420 160 L220 240 z" fill="#B86A10" fill-opacity="0.10" stroke="none">
    <animate attributeName="fill-opacity" values="0;0.10;0.10;0" dur="7s" keyTimes="0;0.35;0.8;1" repeatCount="indefinite"/>
  </path>

  <!-- a -->
  <line x1="60" y1="200" x2="256" y2="122" stroke="#B86A10" stroke-width="3" marker-end="url(#ah-a)"/>
  <text x="150" y="145" fill="#B86A10" font-size="15" font-weight="600">a</text>
  <!-- b -->
  <line x1="60" y1="200" x2="216" y2="238" stroke="#42708F" stroke-width="3" marker-end="url(#ah-b)"/>
  <text x="140" y="235" fill="#42708F" font-size="15" font-weight="600">b</text>
  <!-- a+b -->
  <line x1="60" y1="200" x2="415" y2="161" stroke="#1B3A52" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#ah-s)">
    <animate attributeName="stroke-opacity" values="0;0;1;1;0" dur="7s" keyTimes="0;0.3;0.42;0.82;1" repeatCount="indefinite"/>
  </line>
  <text x="330" y="150" fill="#1B3A52" font-size="15" font-weight="600">a + b
    <animate attributeName="opacity" values="0;0;1;1;0" dur="7s" keyTimes="0;0.3;0.42;0.82;1" repeatCount="indefinite"/>
  </text>

  <!-- projection of b onto a -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" dur="7s" keyTimes="0;0.55;0.65;0.88;1" repeatCount="indefinite"/>
    <line x1="216" y1="238" x2="163" y2="163" stroke="#8C99A4" stroke-width="1.3" stroke-dasharray="4 4"/>
    <line x1="60" y1="200" x2="163" y2="163" stroke="#5B8C5A" stroke-width="5" stroke-linecap="round"/>
    <text x="86" y="185" fill="#3E6B3D" font-size="12.5" font-weight="600">a·b / |a|</text>
  </g>

  <text x="470" y="60"  fill="#1B3A52" font-size="13.5" font-weight="600">Dot product</text>
  <text x="470" y="80"  fill="#5B6873" font-size="12.5">scalar — how much</text>
  <text x="470" y="97"  fill="#5B6873" font-size="12.5">b points along a</text>
  <text x="470" y="128" fill="#1B3A52" font-size="13.5" font-weight="600">Cross product</text>
  <text x="470" y="148" fill="#5B6873" font-size="12.5">magnitude equals the</text>
  <text x="470" y="165" fill="#5B6873" font-size="12.5">shaded area</text>
</svg>
