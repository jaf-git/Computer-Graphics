<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" width="620" height="250" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="620" height="250" rx="8" fill="#F7F9FA"/>
  <defs>
    <clipPath id="win"><rect x="190" y="70" width="230" height="110"/></clipPath>
  </defs>

  <rect x="190" y="70" width="230" height="110" fill="#B86A10" fill-opacity=".07" stroke="#B86A10" stroke-width="2.4"/>
  <text x="305" y="200" fill="#B86A10" font-size="12.5" text-anchor="middle">clipping window</text>

  <!-- case 1: trivially accepted -->
  <g>
    <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" dur="12s" keyTimes="0;0.04;0.24;0.30;0.5;0.6;0.8;0.95;1" repeatCount="indefinite"/>
    <line x1="220" y1="150" x2="390" y2="95" stroke="#3E7A4E" stroke-width="3.2"/>
    <circle cx="220" cy="150" r="4.5" fill="#3E7A4E"/><circle cx="390" cy="95" r="4.5" fill="#3E7A4E"/>
    <text x="60" y="40" fill="#3E7A4E" font-size="14" font-weight="700">Accept</text>
    <text x="60" y="60" fill="#5B6873" font-size="12.5">0000 | 0000 = 0</text>
    <text x="60" y="78" fill="#5B6873" font-size="12.5">both ends inside, draw it</text>
  </g>

  <!-- case 2: trivially rejected -->
  <g>
    <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" dur="12s" keyTimes="0;0.28;0.32;0.36;0.56;0.62;0.8;0.95;1" repeatCount="indefinite"/>
    <line x1="120" y1="215" x2="330" y2="230" stroke="#B4444B" stroke-width="3.2" stroke-dasharray="7 5"/>
    <circle cx="120" cy="215" r="4.5" fill="#B4444B"/><circle cx="330" cy="230" r="4.5" fill="#B4444B"/>
    <text x="60" y="40" fill="#B4444B" font-size="14" font-weight="700">Reject</text>
    <text x="60" y="60" fill="#5B6873" font-size="12.5">0100 &amp; 0100 ≠ 0</text>
    <text x="60" y="78" fill="#5B6873" font-size="12.5">both below — no maths needed</text>
  </g>

  <!-- case 3: clipped -->
  <g>
    <animate attributeName="opacity" values="0;0;0;0;0;1;1;1;0" dur="12s" keyTimes="0;0.3;0.4;0.5;0.6;0.66;0.85;0.95;1" repeatCount="indefinite"/>
    <line x1="120" y1="205" x2="500" y2="45" stroke="#9AA7B1" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="120" y1="205" x2="500" y2="45" stroke="#1B3A52" stroke-width="3.6" clip-path="url(#win)"/>
    <circle cx="120" cy="205" r="4.5" fill="#9AA7B1"/><circle cx="500" cy="45" r="4.5" fill="#9AA7B1"/>
    <circle cx="221" cy="163" r="5" fill="#1B3A52"/>
    <circle cx="482" cy="52"  r="5" fill="#1B3A52" opacity="0"/>
    <circle cx="382" cy="95"  r="5" fill="#1B3A52"/>
    <text x="60" y="40" fill="#1B3A52" font-size="14" font-weight="700">Clip</text>
    <text x="60" y="60" fill="#5B6873" font-size="12.5">neither test settles it</text>
    <text x="60" y="78" fill="#5B6873" font-size="12.5">compute intersections, repeat</text>
  </g>
</svg>
